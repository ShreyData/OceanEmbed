services:
  postgres:
    image: postgres:16
    container_name: oceanembed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oceanembed
      POSTGRES_USER: oceanembed
      POSTGRES_PASSWORD: oceanembed
    ports:
      # 5433 avoids a pre-existing local PostgreSQL service on this development machine.
      - "5433:5432"
    volumes:
      - oceanembed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanembed -d oceanembed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oceanembed_postgres_data:
